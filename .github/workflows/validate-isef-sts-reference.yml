name: Validate ISEF STS reference index
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_isef_sts_reference.py --integrated
